version: '3.8'

services:
  coffee-pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee-pos
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
    volumes:
      # Persist SQLite database
      - coffee-pos-data:/app/data
      # Persist uploaded images
      - coffee-pos-uploads:/app/dist/client/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  coffee-pos-data:
    driver: local
  coffee-pos-uploads:
    driver: local
